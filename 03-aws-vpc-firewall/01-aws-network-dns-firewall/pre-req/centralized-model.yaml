AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS Network Firewall demo using centralized deployment model."

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      # - Label:
      #     default: "VPC Parameters"
      #   Parameters: 
      #     - AvailabilityZone1Selection
      #     - AvailabilityZone2Selection
      - Label:
          default: "EC2 Parameters"
        Parameters: 
          - LatestAmiId
      - Label:
          default: "ACM Certificate"
        Parameters: 
          - DomainName          

Parameters:
  # AvailabilityZone1Selection:
  #   Description: Availability Zone 1
  #   Type: AWS::EC2::AvailabilityZone::Name

  # AvailabilityZone2Selection:
  #   Description: Availability Zone 2
  #   Type: AWS::EC2::AvailabilityZone::Name
  MyAssetsBucketName:
    Description: Assets bucket name
    Type: String
  MyAssetsBucketPrefix:
    Description: Assets bucket prefix
    Type: String

  LatestAmiId:
    Description: Latest EC2 AMI from Systems Manager Parameter Store
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

  DomainName:
    Type: String
    Default: 'workshops.unicorndns.net'    

Resources:
# Spoke VPC A:
  VPCA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.1.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCA

  SubnetAWorkload:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCA
      CidrBlock: "10.1.1.0/24"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCA-WorkloadSubnetA

  SubnetATGW:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCA
      CidrBlock: "10.1.0.0/28"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCA-TGWSubnetA

  VPCAEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
        GroupDescription: Allow instances to get to SSM Systems Manager
        GroupName: AnfwDemo-SpokeVPCA-SSMEndpoint-Sg
        VpcId: !Ref VPCA
        SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.1.0.0/16
        Tags:
          - Key: Name
            Value: "AnfwDemo-SpokeVPCA-SSMEndpoint-Sg"          

  VPCASSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
        SubnetIds: 
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA

  VPCAEC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
        SubnetIds: 
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA

  VPCASSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
        SubnetIds: 
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA
 
  SubnetARole:
    Type: AWS::IAM::Role
    Properties: 
      RoleName: !Sub "AnfwDemo-SpokeVPCA-WorkloadRole-${AWS::Region}"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

  SubnetAInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref SubnetARole
        
  SubnetASecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ICMP acess from 10.0.0.0/8"
      GroupName: AnfwDemo-SpokeVPCA-WorkloadSubnetA-Sg
      VpcId: !Ref VPCA
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/8
          FromPort: -1
          ToPort: -1
      Tags:
        - Key: Name
          Value: "AnfwDemo-SpokeVPCA-WorkloadSubnetA-Sg"                   
 
  # Spoke VPC A Test Instance 1 UserData is for:
  # Lab 4 - Custome Suricata rules with Strict Rule ordering
  # Lab 5 - Threat Hunting with AWS Network Firewall
  TestInstance1SubnetA:
    Type: AWS::EC2::Instance
    DependsOn:
      - 'SubnetAWorkloadDefaultRoute'
      - 'SpokeInspectionRoute'
      - 'FirewallSpokeVPCARoute'
      - 'SubnetCTGWADefaultRoute'
      - 'SubnetCFirewallADefaultRoute'      
      - 'SubnetCFirewallAInternalRoute'
      - 'SubnetCPublicADefaultRoute'
      - 'SubnetCPublicAInternalRoute'
      - 'SubnetCFtpServerEIP'
      - 'FtpServerInstance1SubnetC' 
    Properties:
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetAWorkload
      InstanceType: t2.micro
      SecurityGroupIds:
        - !Ref SubnetASecurityGroup
      IamInstanceProfile: !Ref SubnetAInstanceProfile
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCA-TestInstance1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          sleep 60
          date > /tmp/image.log
          sudo yum update -y
          sudo yum -y install httpd php mysql php-mysql ftp

          sudo systemctl enable --now httpd
          sudo systemctl start httpd

          # configure web server:
          cd /var/www/html
          wget https://s3.amazonaws.com/immersionday-labs/bootcamp-app.tar
          tar xvf bootcamp-app.tar
          chown apache:root /var/www/html/rds.conf.php

          { echo ${FtpServerInstance1SubnetC.PrivateIp};} >> /tmp/ftp.ip

          # Create Fake Customer Data Files
          cat << 'EOF' > /tmp/employee-data.txt
          # Sample Report - No identification of actual persons
          # or places is intended or should be inferred.

          74323 Julie Field
          Lake Joshuamouth, OR 30055-3905
          1-196-191-4438x974
          53001 Paul Union
          New John, HI 94740
          American Express
          Amanda Wells
          5135725008183484 09/26
          CVE: 550

          354-70-6172
          242 George Plaza
          East Lawrencefurt, VA 37287-7620
          GB73WAUS0628038988364
          587 Silva Village
          Pearsonburgh, NM 11616-7231
          LDNM1948227117807
          American Express
          Brett Garza
          347965534580275 05/20
          CID: 4758
          EOF

          # Create Fake /etc/passwd
          cat << 'EOF' > /tmp/passwd.txt
          blackwidow:x:10:100::/home/blackwidow:/bin/bash
          thor:x:11:100::/home/thor:/bin/bash
          ironman:x:12:100::/home/ironman:/bin/bash
          captain:x:13:100::/home/captain:/bin/bash
          hulk:x:14:100::/home/hulk:/bin/bash
          hawkeye:x:15:100::/home/hawkeye:/bin/bash
          EOF

          # Upload fake employee data
          sleep 5
          cd /tmp
          HOST=${FtpServerInstance1SubnetC.PrivateIp}
          PORT=443
          USER=badactor
          PASSWD=5VXcbio8D3nsly
          ftp -inv $HOST $PORT <<EOT
          user $USER $PASSWD
          cd ftp/upload
          put passwd.txt
          put employee-data.txt
          bye
          EOT

          # Create FTP script
          cat << 'EOF' > /tmp/ftp.sh
          #!/bin/bash
          HOST=${FtpServerInstance1SubnetC.PrivateIp}
          PORT=443
          USER=badactor
          PASSWORD=5VXcbio8D3nsly
          ftp -inv $HOST $PORT <<EOT
          user $USER $PASSWORD
          cd ftp/upload
          put passwd.txt
          put employee-data.txt
          bye
          EOT
          EOF
          chmod 755 ftp.sh
          chmod +x ftp.sh
          ftp -inv ./tmp/ftp.sh
          date > /tmp/ftp-time.txt

          # Set cron Job
          cat << 'EOF' > /var/spool/cron/ec2-user
          */1 * * * * /tmp/ftp.sh>>/tmp/cron.log
          EOF          

# Spoke VPC B:
  VPCB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.2.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCB

  SubnetBWorkload:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCB
      CidrBlock: "10.2.1.0/24"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCB-WorkloadSubnetB

  SubnetBTGW:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCB
      CidrBlock: "10.2.0.0/28"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCB-TGWSubnetB

  VPCBEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
        GroupDescription: Allow instances to get to SSM Systems Manager
        GroupName: AnfwDemo-SpokeVPCA-SSMEndpoint-Sg
        VpcId: !Ref VPCB
        SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.2.0.0/16
        Tags:
          - Key: Name
            Value: "AnfwDemo-SpokeVPCB-SSMEndpoint-Sg"           

  VPCBSSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCBEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
        SubnetIds: 
          - !Ref SubnetBWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCB

  VPCBEC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCBEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
        SubnetIds: 
          - !Ref SubnetBWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCB

  VPCBSSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties: 
        PrivateDnsEnabled: true
        SecurityGroupIds: 
          - !Ref VPCBEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
        SubnetIds: 
          - !Ref SubnetBWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCB

  SubnetBRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "AnfwDemo-SpokeVPCB-WorkloadRole-${AWS::Region}"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

  SubnetBInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref SubnetBRole
        
  SubnetBSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ICMP acess from 10.0.0.0/8"
      GroupName: AnfwDemo-SpokeVPCB-WorkloadSubnetB-Sg
      VpcId: !Ref VPCB
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/8
          FromPort: -1
          ToPort: -1
      Tags:
        - Key: Name
          Value: "AnfwDemo-SpokeVPCB-WorkloadSubnetB-Sg"          
 
  # Spoke VPC B Test Instance 1 UserData is for:
  # Lab - Custom Suricata Rules 
  TestInstance1SubnetB:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - 'SubnetBWorkloadDefaultRoute'
      - 'SpokeInspectionRoute'
      - 'FirewallSpokeVPCBRoute'
      - 'SubnetCTGWBDefaultRoute'
      - 'SubnetCFirewallBDefaultRoute'
      - 'SubnetCFirewallBInternalRoute'
      - 'SubnetCPublicBDefaultRoute'
      - 'SubnetCPublicBInternalRoute'    
    Properties:
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetBWorkload
      InstanceType: t2.micro
      SecurityGroupIds:
        - !Ref SubnetBSecGroup
      IamInstanceProfile: !Ref SubnetBInstanceProfile
      Tags:
        - Key: Name
          Value: AnfwDemo-SpokeVPCB-TestInstance1
      UserData:
        Fn::Base64: |
          #!/bin/bash -xe
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1
          sleep 60
          date > /tmp/image.log

          yum update -y
          yum -y install httpd php mysql php-mysql ftp

          systemctl enable --now httpd
          systemctl start httpd

          # configure web server:
          cd /var/www/html
          wget https://s3.amazonaws.com/immersionday-labs/bootcamp-app.tar
          tar xvf bootcamp-app.tar
          chown apache:root /var/www/html/rds.conf.php          

# Inspection + Egress VPC C:
  VPCC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC

  InternetGatewayVPCC:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-IGW

  AttachGatewayVPCC:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        !Ref VPCC
      InternetGatewayId:
        !Ref InternetGatewayVPCC
  
  # AZ A:
  SubnetCNATEIPA:
    Type: "AWS::EC2::EIP"
    Properties:
      Domain: vpc

  SubnetCNATGatewayA:
    Type: "AWS::EC2::NatGateway"
    Properties:
      AllocationId:
        Fn::GetAtt:
          - SubnetCNATEIPA
          - AllocationId
      SubnetId:
        Ref: SubnetCPublicA
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-NATGWA

  SubnetCTGWA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.16.0/28"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-TGWSubnetA

  SubnetCFirewallA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.16.32/28"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-FirewallSubnetA

  SubnetCPublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-PublicSubnetA

  SubnetCELBA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.3.0/24"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-ELBSubnetA

  SubnetCWorkloadA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.5.0/24"
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-WorkloadSubnetA

  # AZ B:
  SubnetCNATEIPB:
    Type: "AWS::EC2::EIP"
    Properties:
      Domain: vpc

  SubnetCNATGatewayB:
    Type: "AWS::EC2::NatGateway"
    Properties:
      AllocationId:
        Fn::GetAtt:
          - SubnetCNATEIPB
          - AllocationId
      SubnetId:
        Ref: SubnetCPublicB
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-NATGWB

  SubnetCTGWB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.16.16/28"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-TGWSubnetB

  SubnetCFirewallB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.16.48/28"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-FirewallSubnetB

  SubnetCPublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-PublicSubnetB

  SubnetCELBB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.4.0/24"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-ELBSubnetB

  SubnetCWorkloadB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCC
      CidrBlock: "10.0.6.0/24"
      AvailabilityZone: !Select 
        - 1
        - Fn::GetAZs: !Ref 'AWS::Region'
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-WorkloadSubnetB

  # This is for Lab 5 and Lab 6
  SubnetCFtpServerEIP:
    DependsOn:
      - AttachGatewayVPCC
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref FtpServerInstance1SubnetC
      Domain: vpc

  SubnetCRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub AnfwDemo-InspectionVPCC-WorkloadRole-${AWS::Region}
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: !Sub "AnfwDemo-FtpServerInstnace-Policy-${AWS::Region}"
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DescribeParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:*"

  SubnetCInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref SubnetCRole

  SubnetCSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FtpServerInstnaceSecurityGroup
      GroupName: AnfwDemo-InspectionVPCC-FtpServerInstance-Sg
      VpcId: !Ref VPCC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/8
        - IpProtocol: tcp
          FromPort: 64000
          ToPort: 64001
          CidrIp: 10.0.0.0/8
      Tags:
        - Key: Name
          Value: "AnfwDemo-InspectionVPCC-FtpServerInstance-Sg"          

  SubnetCSecurityGroupB:
    Type: AWS::EC2::SecurityGroup
    DependsOn:
      - 'SubnetCFtpServerEIP'    
    Properties:
      GroupDescription: ELBSecurityGroup
      GroupName: AnfwDemo-InspectionVPCC-ELB-Sg
      VpcId: !Ref VPCC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Sub '${SubnetCFtpServerEIP}/32'
      Tags:
        - Key: Name
          Value: "AnfwDemo-InspectionVPCC-ELB-Sg"          

  SubnetCSecurityGroupC:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: WebServerInstnaceSecurityGroup
      GroupName: AnfwDemo-InspectionVPCC-WebServerInstance-Sg
      VpcId: !Ref VPCC
      SecurityGroupIngress:
        - SourceSecurityGroupId: !GetAtt SubnetCSecurityGroupB.GroupId
          IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
      Tags:
        - Key: Name
          Value: "AnfwDemo-InspectionVPCC-WebServerInstance-Sg"            

  FtpServerInstance1SubnetC:
    Type: AWS::EC2::Instance
    DependsOn: SubnetCPublicADefaultRoute      
    Properties:
      IamInstanceProfile: !Ref SubnetCInstanceProfile
      InstanceType: m5.large
      ImageId: !Ref LatestAmiId
      NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: '0'
          GroupSet:
            - !Ref SubnetCSecurityGroup
          SubnetId: !Ref SubnetCPublicA
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-FtpServerInstance1
      UserData:
        Fn::Base64: |
          #!/bin/bash -ex
          date > /tmp/image.log
          yum update -y

          # Install and configure FTP server
          yum install -y vsftpd
          cat << 'EOF' > /etc/vsftpd/vsftpd.conf
          ftp_data_port=443
          listen_port=443
          anonymous_enable=NO
          pasv_enable=YES
          pasv_min_port=64000
          pasv_max_port=64001
          port_enable=YES
          pasv_addr_resolve=YES
          write_enable=YES
          connect_from_port_20=YES
          ascii_upload_enable=YES
          local_enable=YES
          chroot_local_user=YES
          allow_writeable_chroot=YES
          userlist_enable=YES
          userlist_file=/etc/vsftpd/user_list
          userlist_deny=NO
          pam_service_name=vsftpd
          EOF

          # Configure FTP
          adduser badactor
          echo 5VXcbio8D3nsly | passwd --stdin badactor
          echo badactor | sudo tee –a /etc/vsftpd/user_list
          mkdir -p /home/badactor/ftp/upload
          chmod 550 /home/badactor/ftp
          chmod 750 /home/badactor/ftp/upload
          chown -R badactor: /home/badactor/ftp

          # Add the public IP to vsftpd config
          { echo -n "pasv_address="; curl -sS "http://checkip.amazonaws.com"; } >> /etc/vsftpd/vsftpd.conf

          # Start the ftp service and set it to launch when the system boots with the following
          systemctl start vsftpd
          systemctl enable vsftpd
          systemctl status vsftpd > /tmp/vsfptd.status

          # Start SSM Agent
          sudo yum install -y https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm

