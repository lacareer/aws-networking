      RouteTableId: !Ref SubnetCFirewallRouteTableB

  SubnetCPublicBInternalRoute:
    Type: AWS::EC2::Route
    DependsOn: 'WebInstance2SubnetCPublicD'
    Properties:
      DestinationCidrBlock: "10.0.0.0/8"
      VpcEndpointId: !GetAtt InspectionFirewallVpceIds.FwVpceId2
      RouteTableId: !Ref SubnetCPublicRouteTableB
      
  SubnetCPublicBDefaultRoute:
    DependsOn: AttachGatewayVPCC
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGatewayVPCC
      RouteTableId: !Ref SubnetCPublicRouteTableB

  SubnetCELBBDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      VpcEndpointId: !GetAtt InspectionFirewallVpceIds.FwVpceId2
      RouteTableId: !Ref SubnetCELBRouteTableB

  SubnetCWorkloadBDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref SubnetCNATGatewayB
      RouteTableId: !Ref SubnetCWorkloadRouteTableB

# Gateway/Ingress Route Table, Route Table Association, Routes:
  # Gateway/Ingress Route Table:
  SubnetCGatewayRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCC
      Tags:
        - Key: Name
          Value: AnfwDemo-InspectionVPCC-GWRouteTable

  # Gateway/Ingress Route Table Association:
  SubnetCGWRouteTableAssociation:
    Type: AWS::EC2::GatewayRouteTableAssociation
    Properties:
      RouteTableId: !Ref SubnetCGatewayRouteTable
      GatewayId: !Ref InternetGatewayVPCC

  # Gateway/Ingress Route Table Routes:

  SubnetCGatewayRouteTablePublicCRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "10.0.3.0/24"
      VpcEndpointId: !GetAtt InspectionFirewallVpceIds.FwVpceId1
      RouteTableId: !Ref SubnetCGatewayRouteTable

  SubnetCGatewayRouteTablePublicDRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "10.0.4.0/24"
      VpcEndpointId: !GetAtt InspectionFirewallVpceIds.FwVpceId2
      RouteTableId: !Ref SubnetCGatewayRouteTable

# TransitGateway route table configuration:
  SpokeRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      Tags:
        - Key: Name
          Value: AnfwDemo-TGW-SpokeRouteTable
      TransitGatewayId: !Ref TransitGateway
      
  FirewallRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      Tags:
        - Key: Name
          Value: AnfwDemo-TGW-FirewallRouteTable
      TransitGatewayId: !Ref TransitGateway
      
  AssociateVPCARouteTable:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref AttachVPCA
      TransitGatewayRouteTableId: !Ref SpokeRouteTable

  AssociateVPCBRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref AttachVPCB
      TransitGatewayRouteTableId: !Ref SpokeRouteTable

  AssociateVPCCRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !Ref AttachVPCC
      TransitGatewayRouteTableId: !Ref FirewallRouteTable

  SpokeInspectionRoute:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      TransitGatewayAttachmentId: !Ref AttachVPCC
      TransitGatewayRouteTableId: !Ref SpokeRouteTable
      
  FirewallSpokeVPCARoute:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      DestinationCidrBlock: "10.1.0.0/16"
      TransitGatewayAttachmentId: !Ref AttachVPCA
      TransitGatewayRouteTableId: !Ref FirewallRouteTable
      
  FirewallSpokeVPCBRoute:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      DestinationCidrBlock: "10.2.0.0/16"
      TransitGatewayAttachmentId: !Ref AttachVPCB
      TransitGatewayRouteTableId: !Ref FirewallRouteTable

# ACM Public Certificate and CNAMEs

  APIInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "APIInvokeRole"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      
  APIInterfaceEndpoint:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcId: !Ref VPCA
      SubnetIds: 
        - !Ref SubnetAWorkload
      SecurityGroupIds:
        - !Ref VPCAEndpointSecurityGroup

  ACMCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub '*.${DomainName}'
      ValidationMethod: DNS
  
  ACMCertificateValidationResource:
    Type: 'Custom::ACMCertificateValidation'
    Properties:
      ServiceToken: !GetAtt ACMLambdaFunction.Arn
      StackName: !Ref 'AWS::StackName'
  
  ACMCertificateDeleteValidationResource:
    Type: 'Custom::ACMCertificateDeleteValidationResource'
    DependsOn: ACMCertificate
    Properties:
      ServiceToken: !GetAtt ACMDeleteValidation.Arn
      StackName: !Ref 'AWS::StackName'
  
  LambdaDeletionResource:
    # DependsOn: DeleteLambdaFunctions
    Type: 'Custom::LambdaDeletionResource'
    Properties:
      ServiceToken: !GetAtt DeleteLambdaFunctions.Arn
      StackName: !Ref 'AWS::StackName'

  ACMLambdaFunctionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:CreateNetworkInterface'
                  - 'ec2:DeleteNetworkInterface'
                  - 'ec2:DescribeInstances'
                  - 'ec2:AttachNetworkInterface'
                  - 'execute-api:Invoke'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'route53:ChangeResourceRecordSets'
                  - 'route53:ListHostedZonesByName'
                  - 'cloudformation:DescribeStackEvents'
                Resource: '*'

  ACMLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      Runtime: python3.12
      Environment:
        Variables:
          deploymentRegion: !Ref AWS::Region
      Timeout: '900'
      Handler: ACMLambdaFunction.handler
      Role: !GetAtt ACMLambdaFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - Ref: VPCAEndpointSecurityGroup
        SubnetIds:
          - Ref: SubnetAWorkload
      Code:
          S3Bucket: !Ref MyAssetsBucketName
          S3Key: !Sub "${MyAssetsBucketPrefix}ACMLambdaFunction/ACMLambdaFunction.zip"
  
  ACMDeleteValidationFunctionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'route53:ChangeResourceRecordSets'
                  - 'route53:ListHostedZonesByName'
                  - 'cloudformation:DescribeStackEvents'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:CreateNetworkInterface'
                  - 'ec2:DeleteNetworkInterface'
                  - 'ec2:DescribeInstances'
                  - 'ec2:AttachNetworkInterface'
                  - 'execute-api:Invoke'
                Resource: '*'
  
  ACMDeleteValidation:
    Type: 'AWS::Lambda::Function'
    Properties:
      Runtime: python3.12
      Timeout: '300'
      Environment:
        Variables:
          deploymentRegion: !Ref AWS::Region
      Handler: ACMDeleteValidation.handler
      Role: !GetAtt ACMDeleteValidationFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - Ref: VPCAEndpointSecurityGroup
        SubnetIds:
          - Ref: SubnetAWorkload
      Code:
          S3Bucket: !Ref MyAssetsBucketName
          S3Key: !Sub "${MyAssetsBucketPrefix}ACMDeleteValidation/ACMDeleteValidation.zip"

  DeleteLambdaFunctionsRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
              - Effect: Allow
                Action: 'lambda:DeleteFunction'
                Resource: 
                  - !Join ['',['arn:', !Ref AWS::Partition, ':lambda:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':function:', !Ref ACMLambdaFunction, ]]
                  - !Join ['',['arn:', !Ref AWS::Partition, ':lambda:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':function:', !Ref ACMDeleteValidation, ]]
                  - !Join ['',['arn:', !Ref AWS::Partition, ':lambda:', !Ref AWS::Region, ':', !Ref AWS::AccountId, ':function:', !Ref ALBCNAMEAddition, ]]

  DeleteLambdaFunctions:
    Type: 'AWS::Lambda::Function'
    DependsOn: ACMCertificateDeleteValidationResource
    Properties:
      Runtime: python3.12
      Timeout: '300'
      Handler: DeleteLambdaFunctions.handler
      Role: !GetAtt DeleteLambdaFunctionsRole.Arn
      Environment:
        Variables:
          Function1: !Ref ACMLambdaFunction
          Function2: !Ref ACMDeleteValidation
          Function3: !Ref ALBCNAMEAddition
      Code:
          S3Bucket: !Ref MyAssetsBucketName
          S3Key: !Sub "${MyAssetsBucketPrefix}DeleteLambdaFunction/DeleteLambdaFunctions.zip"

  ALBCNAMEAdditionResource:
    # DependsOn: ALBCNAMEAddition
    Type: 'Custom::ALBCNAMEAdditionResource'
    Properties:
      ServiceToken: !GetAtt ALBCNAMEAddition.Arn
      StackName: !Ref 'AWS::StackName'

  ALBCNAMEAddition:
    Type: 'AWS::Lambda::Function'
    # DependsOn: SubnetCALB
    Properties:
      Runtime: python3.12
      Timeout: '300'
      Environment: 
        Variables:
          deploymentRegion: !Ref AWS::Region
          ALB: !GetAtt SubnetCALB.DNSName
          AppFQDN:  !Join
                      - ''
                      - - !Ref AWS::AccountId
                        - '.workshops.unicorndns.net'
      Handler: ALBCNAMEAddition.handler
      Role: !GetAtt ACMDeleteValidationFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - Ref: VPCAEndpointSecurityGroup
        SubnetIds:
          - Ref: SubnetAWorkload
      Code:
          S3Bucket: !Ref MyAssetsBucketName
          S3Key: !Sub "${MyAssetsBucketPrefix}ALBCNAMEAddition/ALBCNAMEAddition.zip"

Outputs:
  ExternalALBFQDN:
    Description: External ALB FQDN. Required for creating CNAME
    Value: !GetAtt SubnetCALB.DNSName