# Private Route Tables:
  PrivateRtbA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IngressVpc
      Tags:
        - Key: Name
          Value: "AnfwDemo-IngressVPC-PrivateRtbA"

  PrivateRtbAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRtbA
      SubnetId: !Ref PrivateSubnetA

  PrivateRtbADefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGwA
      RouteTableId: !Ref PrivateRtbA

  PrivateRtbB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IngressVpc
      Tags:
        - Key: Name
          Value: "AnfwDemo-IngressVPC-PrivateRtbB"

  PrivateRtbBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRtbB
      SubnetId: !Ref PrivateSubnetB

  PrivateRtbBDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGwB
      RouteTableId: !Ref PrivateRtbB

# Public Route Tables:
  PublicRtbA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IngressVpc
      Tags:
        - Key: Name
          Value: "AnfwDemo-IngressVPC-PublicRtbA"

  PublicRtbAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRtbA
      SubnetId: !Ref PublicSubnetA

  PublicRtbADefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRtbA

  PublicRtbB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IngressVpc
      Tags:
        - Key: Name
          Value: "AnfwDemo-IngressVPC-PublicRtbB"

  PublicRtbBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRtbB
      SubnetId: !Ref PublicSubnetB

  PublicRtbBDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRtbB

# ALB, Target Group and Listener:
  ALB:
    DependsOn: InternetGateway
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: "AnfwDemo-IngressVPC-ExternalAlb"
      Scheme: internet-facing
      Type: application
      SecurityGroups: 
        - !Ref AlbSecurityGroup  
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      Tags:
      - Key: Name
        Value: "AnfwDemo-IngressVPC-ExternalAlb"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: "AnfwDemo-IngressVPC-Tg1"
      Port: 80
      Protocol: HTTP
      TargetGroupAttributes:
      - Key: deregistration_delay.timeout_seconds
        Value: "20"
      VpcId: !Ref IngressVpc
      HealthCheckPort: '80'
      HealthCheckProtocol: 'HTTP'
      TargetType: instance
      Targets:
        - Id: !Ref WebInstanceA
        - Id: !Ref WebInstanceB     
      Tags:
      - Key: Name
        Value: "AnfwDemo-IngressVPC-Tg1"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Port: 80
      Protocol: HTTP
      DefaultActions:
      - Type: forward
        TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ALB
